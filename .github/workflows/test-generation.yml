name: Test Generation

on:
  #schedule:
    # Weekdays at 06:00 UTC
   #- cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: dev1
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}
      CI: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if [ -d "$HOME/.cursor/bin" ]; then
            echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          fi

      - name: Configure git for agent PRs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run backlog test generation
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          agent -p --force --trust --output-format text "$(cat <<'EOF'
          You are the QA orchestrator running in **Backlog mode**. Follow `.cursor/rules/qa-orchestrator.mdc` and project skills under `.cursor/skills/`.

          ## Queue (you do not self-start — this run is the trigger)

          Fetch DS tickets with JQL (max 10 results):
          `project = DS AND status = "In Progress" AND labels != tests-generated ORDER BY updated ASC`

          Atlassian cloud ID: `https://legionqaschool.atlassian.net`
          Jira project key: `DS`

          Process **at most 5 tickets** from that queue, in order.

          ## Per ticket (same order every time)

          1. **Analyze** — apply **jira-ticket-to-gherkin**; produce Gherkin + handoff notes
          2. **test-writer** — implement a conforming Playwright spec under `tests/` (POM conventions, cleanup, a11y where applicable)
          3. **Run** — `npx playwright test <spec> --project=chromium`
          4. **Red?** → **triage** → real app bug: note in PR (do not file Jira bugs without human approval); test issue: fix via test-writer if straightforward, else document in PR

          ## Output (per ticket)

          - Create branch `qa/<TICKET-KEY>-tests`, commit spec + any POM/feature files
          - Open **one PR per ticket**; PR title and body must link the Jira ticket
          - After the PR is opened and the spec run is complete for that ticket, add Jira label **`tests-generated`** so the next run skips it

          ## Guardrails

          - **Budget:** stop after 5 tickets
          - **Stop and skip:** if the same spec fails with the **same error twice** for a ticket, stop retrying that ticket, record the failure in the PR/handoff, and move on
          - **Never merge** a PR, **never close** a Jira ticket, and **never file or close** bugs without human approval
          - Use `DIDAXIS_*` env vars for app auth; `ATLASSIAN_API_TOKEN` for Jira; `GITHUB_TOKEN` for git/gh PR operations

          ## Handoff

          When finished, print a summary: tickets processed, PR URLs, pass/fail per spec, tickets skipped, and any items needing human review.

          Then write `.eval/session.json` (`asked` / `guessed` counts from this run) and run `node scripts/write-eval-report.mjs`.
          EOF
          )"

      - name: Write eval-report.md
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVAL_TRIGGER: test-generation.yml
        run: node scripts/write-eval-report.mjs

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: eval-report
          path: eval-report.md
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 8
